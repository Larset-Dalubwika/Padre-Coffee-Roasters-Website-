<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./pcr.css">
</head>

<body>
    <div class="center-container">
        <h2>Log in</h2>

        <div class="form-container">
            <p class="form-label">EMAIL</p>
            <input type="text" placeholder="Enter your email" class="form-input">
        </div>

        <div class="form-container">
            <p class="form-label">PASSWORD</p>
            <input type="password" placeholder="Enter your password" class="form-input">
        </div>

        <a class="center forgot-pass maxwidth">Forgot Password?</a>

        <a class="a btn-dark maxwidth">Log in</a>

        <p class="center">or</p>

        <a class="a btn maxwidth">
            <img src="./assets/iconography/google.svg" alt="Google Icon" class="icon-s">
            Log in with Google
        </a>

        <a href="./signup.html" class="a btn-borderless center btn-signup maxwidth">Need an account? Sign Up</a>
    </div>
</body>

</html>
