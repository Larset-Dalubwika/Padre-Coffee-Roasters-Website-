<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    
    <link rel="stylesheet" href="./pcr.css">

    <script src="./placeholder-images.js"></script>
</head>

<body>
    <header>
        <section class="upper-header">
            <img src="./assets/iconography/logo.png" alt="Logo" class="logo">
            <p class="brand">Padre Coffee Roasters</p>
            <nav class="header-nav">
                <a href="./menu.html" class="nav-link">Menu</a>
                <a href="./order.html" class="nav-link">Order</a>
                <a href="./about.html" class="nav-link">About</a>

                <div class="nav2">
                    <a href="login.html" class="a nav-link">Log In</a>
                    <!-- <button>Cart (2)</button> -->
                </div>
            </nav>
        </section>

        <!-- <section class="lower-header">
            <div class="search-bar">
                <p class="search-icon">⌕</p>
                <input type="text" placeholder="Search...">
            </div>

            <button class="btn-dark">Pickup</button>
            <button>Delivery</button>
            <button class="btn-borderless">Log In</button>
            <button>Cart (2)</button>
        </section> -->

    </header>

    <main>
        <div class="filler"></div>
        <section class="hero">
            <section class="left-hero">
                <h1 class="hero-header">Tara, kape tayo!</h1>
                <p class="subtext">Drink and Chill.</p>

                <!-- <p class="chooseordertype">Choose Order Type</p>

                <section class="ordertypes">
                    <section class="upper-ot">
                        <button class="btn-dark">Pickup</button>
                        <button>Delivery</button>
                    </section>
                    <button class="btn-dark" id="start-order">START ORDER</button>
                </section> -->
            </section>

            <section class="right-hero">
                <div class="splash-container">
                    <img src="./assets/splash-images/splash.jpg" alt="Splash Image" class="splash-img">
                </div>
            </section>
        </section>

        <section class="menu-preview">
            <h2 class="menu-header">Menu</h2>
            <section class="menu-track-container">
                <div id="menu-track" data-mouse-down-at="0" data-prev-percentage="0">
                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/coffee.jpg" alt="Coffee" class="category-img">
                        </div>
                        <p class="category-name">Coffee</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/iced-coffee.jpeg" alt="Iced Coffee" class="category-img">
                        </div>
                        <p class="category-name">Iced Coffee</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/non-coffee.jpeg" alt="Non-Coffee" class="category-img">
                        </div>
                        <p class="category-name">Non-Coffee</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/smoothies-and-cold-pressed-juice.jpeg" alt="Smoothies and Cold Pressed Juice" class="category-img">
                        </div>
                        <p class="category-name">Smoothies and Cold Pressed Juice</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/pasta.jpeg" alt="Pasta" class="category-img">
                        </div>
                        <p class="category-name">Pasta</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/steak-and-rice.jpeg" alt="Steak & Rice" class="category-img">
                        </div>
                        <p class="category-name">Steak & Rice</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/all-day-breakfast.jpeg" alt="All-Day Breakfast" class="category-img">
                        </div>
                        <p class="category-name">All-Day Breakfast</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/western-style-breakfast.jpeg" alt="Western Style Breakfast" class="category-img">
                        </div>
                        <p class="category-name">Western Style Breakfast</p>
                    </div>

                    <div class="menu-track-item">
                        <div class="category-img-container">
                            <img src="./assets/menu-thumbnails/menu-category-thumbnails/burger-and-sandwich.jpeg" alt="Burger and Sandwich" class="category-img">
                        </div>
                        <p class="category-name">Burger and Sandwich</p>
                    </div>
                </div>
            </section>

        </section>
    </main>

    <script src="./track.js"></script>
    
</body>

</html>
