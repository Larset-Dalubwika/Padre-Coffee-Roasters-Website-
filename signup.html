<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./pcr.css">
</head>

<body>
    <div class="center-container">
        <h2>Sign Up</h2>

        <div class="form-container">
            <p class="form-label">NAME</p>
            <input type="text" placeholder="Enter your name" class="form-input">
        </div>

        <div class="form-container">
            <p class="form-label">EMAIL</p>
            <input type="text" placeholder="Enter your email" class="form-input">
        </div>

        <div class="form-container">
            <p class="form-label">PHONE NUMBER</p>
            <input type="text" placeholder="Enter phone number" class="form-input">
        </div>

        <div class="form-container">
            <p class="form-label">PASSWORD</p>
            <input type="password" placeholder="Enter your password" class="form-input">
        </div>

        <p></p>

        <a class="a btn-dark maxwidth sign-in">Sign In</a>

        <p class="center">or</p>

        <a class="a btn maxwidth">Log in with Google</a>

        <a href="./login.html" class="a btn-borderless center btn-signup maxwidth">I already have an account / Login</a>
    </div>
</body>

</html>
